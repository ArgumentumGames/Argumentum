<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxonomy Mind Map</title>
    <style>
        body {
            font-family: 'DINPro', sans-serif;
        }

        .hidden {
            display: none;
        }

        #mindmap {
            position: relative;
        }

        .node:hover {
            cursor: pointer;
        }

        .node.active {
            fill: red;
        }


        /* -------------------------------------------------------------------------------- */
        /* Fonts */
        /* -------------------------------------------------------------------------------- */

        @font-face {
            font-family: 'DINPro';
            font-style: normal;
            font-weight: 300;
            src: local('DINPro'), url('https://fonts.cdnfonts.com/s/18774/DINPro-Light tr.woff') format('woff');
        }

        @font-face {
            font-family: 'DINPro';
            font-style: normal;
            font-weight: 500;
            src: local('DINPro'), url('https://fonts.cdnfonts.com/s/18774/DINPro-Medium tr.woff') format('woff');
        }

        @font-face {
            font-family: 'DINPro';
            font-style: normal;
            font-weight: 700;
            src: local('DINPro'), url('https://fonts.cdnfonts.com/s/18774/DINPro-Bold tr.woff') format('woff');
        }

        @font-face {
            font-family: 'DINPro';
            font-style: normal;
            font-weight: 900;
            src: local('DINPro'), url('https://fonts.cdnfonts.com/s/18774/DINPro-Black tr.woff') format('woff');
        }




        /* -------------------------------------------------------------------------------- */
        /* Couleurs */
        /* -------------------------------------------------------------------------------- */

        /* Défaut (fallback couleur + centrage restaurés depuis golden master eb83d113) —
           applique une couleur de fond même si la classe familyclass (casse variable) ne
           matche pas une règle card.<famille> spécifique (CSS est case-sensitive). */
        card {
            --color-background: #811da3;
            --color-text-1: #601362;
            --color-text-2: #8f5991;
            --color-text-3: #a173a2;
        }

        /* Fallacies — 8 familles (sélecteurs à la casse EXACTE de l'attribut
           familyclass posé par le runtime : Family.Replace(" ","")). */
        card.Insuffisance {
            --color-background: #811da3;
            --color-text-1: #601362;
            --color-text-2: #8f5991;
            --color-text-3: #a173a2;
        }

        card.Influence {
            --color-background: #ff66eb;
            --color-text-1: #b3009b;
            --color-text-2: #cc00b1;
            --color-text-3: #e566d4;
        }

        card.Erreurmathématique {
            --color-background: #08af93;
            --color-text-1: #14555b;
            --color-text-2: #5a888c;
            --color-text-3: #749a9e;
        }

        card.Erreurderaisonnement {
            --color-background: #8dc801;
            --color-text-1: #476205;
            --color-text-2: #7e9150;
            --color-text-3: #92a26b;
        }

        card.Abusdelangage {
            --color-background: #0054a4;
            --color-text-1: #0c2861;
            --color-text-2: #546890;
            --color-text-3: #6f80a1;
        }

        card.Tricherie {
            --color-background: #ffc307ff;
            --color-text-1: #9e7800ff;
            --color-text-2: #c49500ff;
            --color-text-3: #d6b755ff;
        }

        card.Obstruction {
            --color-background: #dc0f0a;
            --color-text-1: #960a07;
            --color-text-2: #b55351;
            --color-text-3: #c16e6c;
        }

        card.Argumentfallacieux {
            --color-background: #555555;
            --color-text-1: #2a2a2a;
            --color-text-2: #6e6e6e;
            --color-text-3: #888888;
        }

        /* Virtues — 8 familles. Les sélecteurs utilisent la casse EXACTE de
           l'attribut familyclass posé par le runtime (CSS est case-sensitive). */
        card.Raisonnementvalide {
            --color-background: #8dc801;
            --color-text-1: #476205;
            --color-text-2: #7e9150;
            --color-text-3: #92a26b;
        }

        card.Échangeenrichissant {
            --color-background: #dc0f0a;
            --color-text-1: #960a07;
            --color-text-2: #b55351;
            --color-text-3: #c16e6c;
        }

        card.Argumentpertinent {
            --color-background: #811da3;
            --color-text-1: #601362;
            --color-text-2: #8f5991;
            --color-text-3: #a173a2;
        }

        card.Honnêtetéintellectuelle {
            --color-background: #ffc307ff;
            --color-text-1: #9e7800ff;
            --color-text-2: #c49500ff;
            --color-text-3: #d6b755ff;
        }

        card.Présentationintègre {
            --color-background: #ff66eb;
            --color-text-1: #b3009b;
            --color-text-2: #cc00b1;
            --color-text-3: #e566d4;
        }

        card.Rigueurmathématique {
            --color-background: #08af93;
            --color-text-1: #14555b;
            --color-text-2: #5a888c;
            --color-text-3: #749a9e;
        }

        card.Langageexact {
            --color-background: #0054a4;
            --color-text-1: #0c2861;
            --color-text-2: #546890;
            --color-text-3: #6f80a1;
        }

        card.Argumentvalable {
            --color-background: #555555;
            --color-text-1: #2a2a2a;
            --color-text-2: #6e6e6e;
            --color-text-3: #888888;
        }

        card .famille {
            color: var(--color-text-1);
        }

        card .sous_famille {
            color: var(--color-text-2);
        }

        card .Soussousfamille {
            color: var(--color-text-3);
        }

        /* -------------------------------------------------------------------------------- */
        /* Structure */
        /* -------------------------------------------------------------------------------- */

        card {
            background-color: white;
            display: flex;
            flex-direction: column;
            font-family: 'Bebas Neue', sans-serif;
            left: 50%;
            position: fixed;
            top: 50%;
            transform: translate(-50%, -50%);
            /* #1253 - la fiche porte le ratio de la carte de jeu (tarot 69,85 x 120,65 mm).
               Avant #827 la boite valait 50vw x 50vh ; ce commit a retire `height` et fige la
               largeur a 300px, alors que la typographie interne reste en vh (.famille: 5.6vh) :
               la hauteur suivait donc le viewport sans aucune borne. Mesure avant correctif,
               viewport 1280x1400 : 300 x 2135 px, ratio 7,12 - soit 152 % de la hauteur d'ecran.
               Une hauteur en vh + un ratio fixe redonnent une boite bornee et coherente avec
               une typographie elle aussi en vh. */
            height: 80vh;
            aspect-ratio: 69.85 / 120.65;
            overflow: hidden;
            z-index: 100;
        }

        bleed {
        }

        cut {
        }

        safe {
            background-color: #fff;
            position: relative;
        }

        .cardName {
            display: none;
        }

        /* -------------------------------------------------------------------------------- */
        /* Entête */
        /* -------------------------------------------------------------------------------- */

        .header {
            /* display: flex;*/
            justify-content: center;
            padding-top: 1%;
        }

        .famille {
            text-transform: uppercase;
            font-size: 5.6vh;
            text-align: center;
            color: var(--color-text-1);
        }

        .sous_famille {
            font-size: 3.4vh;
            letter-spacing: 0.05vh;
        }

        .Soussousfamille {
            font-size: 1.8vh;
        }


        /* -------------------------------------------------------------------------------- */
        /* Corps */
        /* -------------------------------------------------------------------------------- */

        .body {
            display: flex;
            padding-top: 2%;
            flex-flow: column nowrap;
            height: 100%;
            justify-content: space-between;
            border: 2.8vh solid;
            border-color: var(--color-background);
            border-radius: 2vh;
        }

        .supersetWrapper .famille {
            max-height: 61%;
            width: 100%;
            display: block;
            padding: 0;
            margin-bottom: 1.3%
        }

        .supersetWrapper .sous_famille {
            width: 100%;
            display: block;
            padding: 0;
            margin-bottom: 1%;
            text-align: center;
        }

        .contentWrapper {
            display: flex;
            flex-direction: column;
            height: 93%;
        }


        .title {
            width: 100%;
            text-align: center;
            font-size: 5vh;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--color-text-1);
            box-sizing: border-box;
            flex-shrink: 0;
            padding: 2% 5% 1% 5%;
            word-wrap: break-word !important;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            .title > div {
                flex-shrink: 1;
                width: 100%;
                overflow-wrap: normal
            }

        .imageSection {
            min-height: 0;
            flex-shrink: 1;
            display: flex;
            flex-flow: column;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
            height: 100%;
        }

        .image {
            width: 100%;
            flex-grow: 1;
            /* display: flex; */
            /* justify-content: flex-start; */
            /* align-items: flex-start; */
            text-align: center;
            /*background-color: var(--color-background-img);*/
            padding: 1% 2% 0 2%;
            min-height: 0;
        }

            .image img {
                max-width: 100%;
                max-height: 100%;
                position: relative;
                top: 50%;
                transform: translateY(-50%);
            }

        .texte {
            /*display: flex;
        flex-flow: column wrap;*/
            justify-content: space-between;
            background-color: var(--color-background);
            margin: 0% -1% -1% -1%;
        }

        .desc_fr {
            display: flex;
            align-items: center;
            text-transform: uppercase;
            font-family: 'DINpro',sans-serif;
            font-weight: 900;
            font-size: 3.2vh;
            /*margin:4% 5% 3% 5%;*/

            padding: 2% 5% 2% 5%;
            color: #fff;
        }

        .exemple_fr {
            font-family: 'DINpro',sans-serif;
            color: var(--color-text-2);
            font-size: 2.9vh;
            font-weight: 600;
            padding: 2% 5% 2% 5%;
            background-color: white;
            -webkit-font-variant-ligatures: no-common-ligatures;
            font-variant-ligatures: no-common-ligatures;
        }

        .desc_fr,
        .exemple_fr {
            overflow-wrap: break-word;
        }

        #externalLink {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: var(--color-text-1);
            border: none;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition-duration: 0.4s;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
        }

            #externalLink:hover {
                color: var(--color-text-1);
                background-color: white;
                box-shadow: none;
            }


        /* -------------------------------------------------------------------------------- */
        /* Pied de page */
        /* -------------------------------------------------------------------------------- */

        .footer {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 4vh;
            height: 4vh;
            background-color: #fff;
            border: 1px solid;
            border-color: var(--color-background);
            border-radius: 16px 16px 16px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .niveau {
            font-size: 2.8vh;
            font-weight: bold;
            text-align: right;
            color: var(--color-background);
        }

        /* -------------------------------------------------------------------------------- */
        /* Zoom */
        /* -------------------------------------------------------------------------------- */


        .zoomable {
            transform-origin: 0 0;
            transition: none;
            cursor: grab;
        }

        .zoomable.panning {
            cursor: grabbing;
        }


    </style>

                                </div>

                        </div>
                        <div class="imageSection">
                            <a id="externalLink" href="#" target="_blank"></a>
                            <div class="title">
                                <div></div>
                            </div>
                        </div>
                        <div class="texte">
                            <div class="desc_fr"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const overlay = document.getElementsByTagName('card')[0];
        const title = document.getElementsByClassName('title')[0];
        const famille = document.getElementsByClassName('famille')[0];
        const sous_famille = document.getElementsByClassName('sous_famille')[0];
        const Soussousfamille = document.getElementsByClassName('Soussousfamille')[0];
        const description = document.getElementsByClassName('desc_fr')[0];
        const example = document.getElementsByClassName('exemple_fr')[0];
        const externalLink = document.getElementById('externalLink');
        const niveau = document.getElementsByClassName('niveau')[0];
        let isNodeActive = false;
        let hideOverlayTimeout = null;
        let activeNode = null;

        const nodes = document.querySelectorAll('.node');

        const hideOverlay = () => {
            overlay.classList.add('hidden');
            isNodeActive = false;
            if (activeNode) {
                activeNode.classList.remove('active');
                activeNode = null;
            }
        };

        const showOverlay = (e) => {
            isNodeActive = true;

            // Remove the 'active' class from any previously active node
            const activeNode = document.querySelector('.node.active');
            if (activeNode) {
                activeNode.classList.remove('active');
            }

            let targetNode = e.target;
            if (!targetNode.classList.contains('node') && targetNode.parentElement.classList.contains('node')) {
                targetNode = targetNode.parentElement;
            }

            // Add the 'active' class to the clicked node
            targetNode.classList.add('active');

            title.textContent = targetNode.textContent;
            famille.textContent = targetNode.getAttribute('family');
            sous_famille.textContent = targetNode.getAttribute('subfamily');
            Soussousfamille.textContent = targetNode.getAttribute('subsubfamily');
            description.innerHTML = targetNode.getAttribute('description');
            example.innerHTML = targetNode.getAttribute('example');
            // #995 — ne pas reserver de surface pour une case vide. Les vertus n'ont pas
            // d'exemple : l'attribut vaut "<p><i></i></p>", ce qui laissait un bandeau
            // blanc sur les 1772 fiches Vertus (8 langues) et sur 47 noeuds Sophismes.
            [description, example].forEach(el => { el.style.display = el.textContent.trim() === '' ? 'none' : ''; });
            externalLink.href = targetNode.getAttribute('link');
            niveau.textContent = targetNode.getAttribute('depth');

            overlay.removeAttribute('class');
            const familyClass = targetNode.getAttribute('familyclass');
            if (familyClass) {
                overlay.classList.add(familyClass);
            }

            // Remove the 'hidden' class if it exists to ensure the card is visible
            if (overlay.classList.contains('hidden')) {
                overlay.classList.remove('hidden');
            }

            // #995 (b) — la carte est dimensionnee en px (card { width: 300px }) alors que
            // sa typographie l'est en vh (.famille: 5.6vh). Sur un ecran de 1000 px de haut
            // le libelle est donc compose a 56 px dans une boite de 244 px : le mot le plus
            // long bave hors de la carte (scrollWidth 479, overflow: visible). 11 libelles
            // sur 11 debordent, Sophismes autant que Vertus. On reduit jusqu'a ce que ca
            // tienne ; la regle CSS reste la taille nominale. Mesure APRES retrait de
            // .hidden : sur un element display:none, clientWidth vaut 0.
            [title, famille, sous_famille, description, example].forEach(el => {
                if (!el) return;
                el.style.fontSize = '';
                if (!el.clientWidth) return;
                let px = parseFloat(getComputedStyle(el).fontSize);
                while (px > 12 && el.scrollWidth > el.clientWidth) {
                    el.style.fontSize = (--px) + 'px';
                }
            });

            // #1253 - passe verticale, symetrique de la passe horizontale ci-dessus. La boite
            // porte desormais un ratio fixe, donc le contenu peut deborder en hauteur la ou il
            // s'etalait librement avant. On reduit uniformement jusqu'a ce qu'il tienne.
            // Plancher 10px ; garde a 200 tours pour qu'un cas pathologique ne fige pas l'onglet.
            const fitEls = [title, famille, sous_famille, Soussousfamille, description, example]
                .filter(el => el && el.clientHeight);
            let vGuard = 0;
            while (overlay.scrollHeight > overlay.clientHeight && vGuard++ < 200) {
                let shrunk = false;
                for (const el of fitEls) {
                    const px = parseFloat(getComputedStyle(el).fontSize);
                    if (px > 10) { el.style.fontSize = (px - 1) + 'px'; shrunk = true; }
                }
                if (!shrunk) break;
            }

            targetNode.classList.add('active');
        };


        nodes.forEach((node) => {
            node.addEventListener('click', showOverlay);
            node.addEventListener('touchstart', showOverlay);
        });

        overlay.addEventListener('mouseleave', hideOverlay);

        document.addEventListener('click', (e) => {
            if (isNodeActive && e.target.closest('.node') === null) {
                e.stopPropagation();
                return;
            }
            if (e.target.closest('.node') === null) {
                hideOverlay();
            }
        });

        document.addEventListener('touchstart', (e) => {
            const isClickedOutside = !overlay.contains(e.target);
            if (isClickedOutside) {
                hideOverlay();
            }
        });

            //Zoom

            var eventsHandler;

            eventsHandler = {
                haltEventListeners: ['touchstart', 'touchend', 'touchmove', 'touchleave', 'touchcancel']
                , init: function (options) {
                    var instance = options.instance
                        , initialScale = 1
                        , pannedX = 0
                        , pannedY = 0

                    // Init Hammer
                    // Listen only for pointer and touch events
                    this.hammer = Hammer(options.svgElement, {
                        inputClass: Hammer.SUPPORT_POINTER_EVENTS ? Hammer.PointerEventInput : Hammer.TouchInput
                    })

                    // Enable pinch
                    this.hammer.get('pinch').set({ enable: true })

                    // Handle double tap
                    this.hammer.on('doubletap', function (ev) {
                        instance.zoomIn()
                    })

                    // Handle pan
                    this.hammer.on('panstart panmove', function (ev) {
                        // On pan start reset panned variables
                        if (ev.type === 'panstart') {
                            pannedX = 0
                            pannedY = 0
                        }

                        // Pan only the difference
                        instance.panBy({ x: ev.deltaX - pannedX, y: ev.deltaY - pannedY })
                        pannedX = ev.deltaX
                        pannedY = ev.deltaY
                    })

                    // Handle pinch
                    this.hammer.on('pinchstart pinchmove', function (ev) {
                        // On pinch start remember initial zoom
                        if (ev.type === 'pinchstart') {
                            initialScale = instance.getZoom()
                            instance.zoomAtPoint(initialScale * ev.scale, { x: ev.center.x, y: ev.center.y })
                        }

                        instance.zoomAtPoint(initialScale * ev.scale, { x: ev.center.x, y: ev.center.y })
                    })

                    document.addEventListener('keydown', (event) => {
                        if (event.key === '+') {
                            instance.zoomIn();
                        } else if (event.key === '-') {
                            instance.zoomOut();
                        }
                    });

                    // Prevent moving the page on some devices when panning over SVG
                    options.svgElement.addEventListener('touchmove', function (e) { e.preventDefault(); });
                },
                destroy: function () {
                    this.hammer.destroy()
                }
            }


            var svgElement = document.querySelector('#mindmap svg');

            if (svgElement) {
                var panZoomInstance = svgPanZoom(svgElement, {
                    zoomEnabled: true,
                    controlIconsEnabled: true,
                    panEnabled: true,
                    mouseWheelZoomEnabled: true,
                    dblClickZoomEnabled: true,
                    fit: 0,
                    controlIconsEnabled: true,
                    minZoom: 0.15,
                    maxZoom: 15,
                    center: 0,
                    //contain: 1,
                    customEventsHandler: eventsHandler
                });

                // === ZOOM INITIAL LISIBLE : centrer sur la racine (restauration #829) ===
                // Carte trop grande : le fit initial montre toute la taxo illisible. On zoome
                // pour afficher ~2600 unites-utilisateur de hauteur autour de la racine
                // (node id=0) => racine + familles lisibles. Additif : le RESET revient au fit,
                // et le zoom-out maximal va PLUS LOIN que le fit (0,15 x fit) -- ce sont deux
                // etats distincts, pas un seul. Les bornes de svg-pan-zoom sont relatives au
                // fit (minZoom * n.zoom dans zoomAtPoint), pas absolues. Mesure #830 Cap 9 :
                // floor/fit = 0,150 sur Fallacies fr ET Virtues fr ; des bornes absolues
                // rendraient 1,00. Le libelle anterieur fusionnait les deux etats et etait
                // faux ; il n'est pas recite ici afin qu'un grep reste un detecteur valide.
                requestAnimationFrame(function () {
                    try {
                        var root = document.querySelector('#mindmap svg g.node[id="0"]');
                        var s0 = panZoomInstance.getSizes();
                        var targetAbs = s0.height / 2600;
                        if (targetAbs < s0.realZoom) targetAbs = s0.realZoom;
                        panZoomInstance.zoom(targetAbs / s0.realZoom);
                        var s = panZoomInstance.getSizes();
                        var cx = s.viewBox.x + s.viewBox.width / 2, cy = s.viewBox.y + s.viewBox.height / 2;
                        if (root) {
                            var m = (root.getAttribute('transform') || '').match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)/);
                            var tx = m ? parseFloat(m[1]) : cx, ty = m ? parseFloat(m[2]) : cy;
                            var bb = null; try { bb = root.getBBox(); } catch (e) {}
                            cx = tx + (bb ? bb.x + bb.width / 2 : 0);
                            cy = ty + (bb ? bb.y + bb.height / 2 : 0);
                        }
                        panZoomInstance.pan({ x: s.width / 2 - cx * s.realZoom, y: s.height / 2 - cy * s.realZoom });
                    } catch (e) { console.error('initial focus error', e); }
                });

                // === RÉACTIVITÉ AU REDIMENSIONNEMENT (restauration #1037) ===
                // #827 avait retiré les listeners resize/orientationchange (légitime pour la
                // fiche repassée au CSS), mais a emporté celui dont svg-pan-zoom a besoin : la
                // bibliothèque ne s'abonne pas à window.resize elle-même. Sans lui, le viewport
                // reste figé sur la géométrie du chargement (racine hors écran sur téléphone ou
                // après rotation). On rappelle resize() PUIS on recentre sur la racine AU NIVEAU
                // DE ZOOM COURANT — jamais fit() (cela ré-introduirait la régression #831 de
                // zoom initial illisible). L'utilisateur garde son échelle et retrouve son repère.
                var recenterRoot = function () {
                    try {
                        var root = document.querySelector('#mindmap svg g.node[id="0"]');
                        var s = panZoomInstance.getSizes();
                        var cx = s.viewBox.x + s.viewBox.width / 2, cy = s.viewBox.y + s.viewBox.height / 2;
                        if (root) {
                            var m = (root.getAttribute('transform') || '').match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)/);
                            var tx = m ? parseFloat(m[1]) : cx, ty = m ? parseFloat(m[2]) : cy;
                            var bb = null; try { bb = root.getBBox(); } catch (e) {}
                            cx = tx + (bb ? bb.x + bb.width / 2 : 0);
                            cy = ty + (bb ? bb.y + bb.height / 2 : 0);
                        }
                        panZoomInstance.pan({ x: s.width / 2 - cx * s.realZoom, y: s.height / 2 - cy * s.realZoom });
                    } catch (e) { console.error('resize recenter error', e); }
                };
                window.addEventListener('resize', function () {
                    panZoomInstance.resize();
                    requestAnimationFrame(recenterRoot);
                });
                window.addEventListener('orientationchange', function () {
                    panZoomInstance.resize();
                    requestAnimationFrame(recenterRoot);
                });

                // Conservez ici votre logique d'affichage de la modale
            } else {
                console.error('SVG not found within #mindmap');
            }


        });
