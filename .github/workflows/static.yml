# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Remove git symlinks
        run: |
          # These are git symlinks (mode 120000) pointing to Windows paths.
          # On Linux they become text files that break tar --dereference.
          rm -f Generation/CardPen/Fallacies Generation/CardPen/Memo \
               Generation/CardPen/Rules Generation/CardPen/Scenarii
          # Also remove server/ subproject (not needed for Pages)
          rm -rf Generation/CardPen/server
      - name: Assemble site (CardPen at the root, ontology under /docs/ontology)
        run: |
          # upload-pages-artifact takes a single path, so stage one tree.
          # CardPen stays at the artifact root => its served URLs are unchanged
          # (the CardPen host contract the pipeline depends on).
          mkdir -p site
          cp -a Generation/CardPen/. site/
          # #133: publish the ontology alongside it. Distinct URLs — GitHub Pages
          # is a static host, so there is no Accept-header content negotiation.
          # See docs/ontology/README.md §6.
          mkdir -p site/docs/ontology
          cp -a docs/ontology/. site/docs/ontology/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
