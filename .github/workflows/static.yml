# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Remove git symlinks
        run: |
          # These are git symlinks (mode 120000) pointing to Windows paths.
          # On Linux they become text files that break tar --dereference.
          rm -f Generation/CardPen/Fallacies Generation/CardPen/Memo \
               Generation/CardPen/Rules Generation/CardPen/Scenarii
          # Also remove server/ subproject (not needed for Pages)
          rm -rf Generation/CardPen/server
      - name: Assemble site (CardPen at the root, ontology under /docs/ontology)
        run: |
          # upload-pages-artifact takes a single path, so stage one tree.
          # CardPen stays at the artifact root => its served URLs are unchanged
          # (the CardPen host contract the pipeline depends on).
          mkdir -p site
          cp -a Generation/CardPen/. site/
          # #133: publish the ontology alongside it. Distinct URLs — GitHub Pages
          # is a static host, so there is no Accept-header content negotiation.
          # See docs/ontology/README.md §6.
          mkdir -p site/docs/ontology
          cp -a docs/ontology/. site/docs/ontology/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
