name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'tmp/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore "Argumentum Converters.sln"

      - name: Build (${{ matrix.configuration }})
        run: dotnet build "Argumentum Converters.sln" --no-restore -c ${{ matrix.configuration }}

      - name: Test
        # #909: the Test step was a silent no-op — Argumentum.AssetConverter.Tests.csproj was NOT in
        # Argumentum Converters.sln, so the Build step never built it, and `--no-build` then found no
        # assembly and exited 0 having run zero tests. Two fixes, both needed:
        #  (1) Tests.csproj is now in the .sln (Restore/Build cover it, and the #587 NuGet audit now
        #      scans test deps too — FluentAssertions, Playwright, xunit).
        #  (2) `--no-build` dropped so the step is self-sufficient: if Tests is ever not built upstream,
        #      `dotnet test` builds it (loud failure on error) instead of silently no-op'ing.
        # Browser tests (HtmlToPngConverterTests, PdfAssemblerTests) self-install chromium in-test via
        # Microsoft.Playwright.Program.Main("install","chromium"); no separate install step needed.
        #
        # VisualTests (Argumentum.AssetConverter.VisualTests.csproj) is DELIBERATELY EXCLUDED from CI:
        # it is a local QA harness that runs AFTER the pipeline, against a populated Target/ (9 000+ PNGs,
        # 5.30 GB) that a fresh CI runner does not have. Adding it would fail every run (no Target/), and
        # filtering it with continue-on-error would fabricate a green check over tests that ran zero
        # assertions — the #909 vert-pour-mauvaise-raison, in a separate project. Its cold-start guards
        # fail loudly (Assert.Fail) so the harness is never mistaken for coverage when run locally.
        # Relocated, not abandoned: it is a release gate run on the regeneration machine before tag, with
        # the pass/fail/skip count recorded in the release dossier. Procedure: docs/quality/visual-tests-release-gate.md (#1048).
        run: dotnet test "Generation/Converters/Argumentum.AssetConverter.Tests/Argumentum.AssetConverter.Tests.csproj" -c ${{ matrix.configuration }} --verbosity normal
