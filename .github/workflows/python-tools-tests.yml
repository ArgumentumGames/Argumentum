        # Aucun dossier de REQUIRED_INDEXES ne peut perdre la marque ; la PR
        # qui pose une marque y ajoute son dossier.
        run: python tools/test_docs-index-contract.py

      - name: Run the ontology snapshot pin (docs/ontology/v1.0.0/)
        # 4 cas, std-lib + `git` : les deux oids de l'instantane, son ensemble de
