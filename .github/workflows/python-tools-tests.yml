# Tests Python offline std-lib : garde d'arbre #1460 + suite DNN i18n #457 + gardes export EAV #458 (charpente #1460)
# + auto-test du gate de merge (scripts/gates) + contrat d'octets des CSV de donnees + contrats de la documentation pour agents + contrat des index de reference + outil du bloc de cloture des issues.
#
# POURQUOI UN WORKFLOW DISTINCT DE build.yml
#   build.yml est le pipeline dotnet principal : il fait tourner 1129 tests .NET a
#   chaque PR. Il ne lance aucun test Python. La garde d'arbre (#1460) est un test
#   **std-lib seulement, sans arborescence Target/** : elle peut tourner n'importe
#   quand, sans bundle, et elle DOIT tourner pour empecher la regression du contrat
#   que la charpente a pose. La mettre dans build.yml ajouterait du bruit au pipeline
#   principal ; la mettre dans un workflow dedie lui donne un signal clair.
#
# CE QUE CE WORKFLOW FAIT (et ne fait pas)
#   Il execute les test_*.py **dont la condition d'execution est documentee** et qui
#   n'exigent AUCUN artefact. Pourquoi pas tous les test_*.py du depot ? Parce que
#   **certains dependent d'un artefact** (la garde elle-meme en mode pilot doit avoir
#   un Target/ ; d'autres outils lisent la base de regeneration). Ce workflow est la
#   **charpente executable** ; chaque test_*.py sera cable quand sa condition
#   d'execution sera documentee. C'est la distinction posee en tete de
#   docs/quality/1460-charpente-suite-regression.md.
#
#   CABLES A CE JOUR (9), avec la condition qui les autorise ici :
#     1. tools/test_1460-structure-charpente-pilot.py -- std-lib, 7 cas, arbres
#        synthetiques ; aucun Target/ requis (le cas 7 est un grounding sur le depot
#        reel, volontairement NON asserte).
#     2. tools/dnn_i18n/test_roundtrip.py -- std-lib, offline. Condition d'execution
#        documentee dans tools/dnn_i18n/README.md §"Execution condition" : toutes les
#        fixtures sont committeés, aucun bundle, aucun Target/, aucun depot G:, et
#        **aucun appel d'API paye** (translate_game_rules.py, le traducteur, n'est PAS
#        execute par ce test). 5 etapes, dont le self-test du pipeline site-content
#        (2 round-trips + 19 controles).
#     3. tools/test_458-eav-export-guards.py -- std-lib, offline, 23 cas. Charge
#        tools/458-eav-content-export.py SANS se connecter a la base (aucun
#        web.config lu) et eprouve ses gardes sur des rangees synthetiques : RawData
#        (soumissions visiteurs, app 50) refuse a la config, dans le SQL et par
#        rangee ; champs app 50 re-derives des vues committees du formulaire ;
#        app 48 bornee a l'entite mesuree E10181 ; temoins ; actualites app 52
#        completes dans les 8 langues (#2182), avec 24 mutations inverses en sous-tests.
#     4. scripts/gates/pr_merge_gate.py --self-test -- std-lib, offline. Le gate de
#        merge lit GitHub via `gh api` en usage reel ; son auto-test NE LE FAIT PAS :
#        instantanes synthetiques + un `gh` factice. Pour chaque regle, le defaut
#        injecte doit rendre le verdict attendu, puis la regle desactivee doit
#        rendre PASS (mutation falsifiante) ; chaque point d'API en echec doit
#        rendre le code 1, jamais 0. Aucun jeton, aucun appel reseau, aucun artefact.
#     5. tools/test_dataset-byte-contract.py -- std-lib, offline, 26 cas. Lit les 5 CSV
#        de donnees vivants DU CHECKOUT (toujours presents : aucun artefact, aucun
#        Target/) et epingle leur forme d'octets : un seul BOM, CRLF en fin
#        d'enregistrement, LF nus en cellule, nombre de champs (les enregistrements
#        courts de Rules sont NOMMES par leur cle), aucun octet de controle. 20
#        mutations des octets reels + 1 temoin prouvent que chaque regle voit son
#        defaut. Deux cas lisent `git check-attr` (regle `-text` de .gitattributes,
#        dans les deux sens, a la casse exacte) : ils ECHOUENT au lieu de se sauter
#        si git manque en CI.
#     6. tools/test_agent-docs-contract.py -- std-lib, offline, 13 cas. Les cas 1-4
#        lisent AGENTS.md, CLAUDE.md et docs/agents/ **du depot reel** : liens
#        relatifs, renvois de section, import unique, budget d'octets des deux
#        fichiers charges par defaut. Les cas 5-13 eprouvent les detecteurs sur un
#        arbre synthetique (un lien mort, un titre renomme, un import ajoute SONT
#        vus). Aucun artefact : les documents controles sont le depot lui-meme.
#     7. tools/test_doc-move-preservation.py -- std-lib + `git` (present sur le
#        runner), offline, 22 cas sur des depots `git init` jetables en repertoire
#        temporaire. N'interroge PAS l'historique du depot reel : le `fetch-depth`
#        par defaut suffit. Eprouve tools/doc-move-preservation.py (preuve ligne a
#        ligne d'un deplacement de documentation) : chaque facon de perdre une ligne
#        est vue, et un organe qui ne peut pas mesurer rend 2, jamais un vert.
#     8. tools/test_docs-index-contract.py -- std-lib + `git ls-files`, offline,
#        8 cas. Le cas 1 lit les index du depot reel (tout README.md sous docs/ ou
#        tools/ qui porte la marque `<!-- index-of-record -->`) : chaque fichier
#        suivi du dossier y est cite avec un statut, aucun lien mort. Les cas 6-12
#        eprouvent les detecteurs sur des depots `git init` jetables. Methode :
#        docs/agents/consolidation.md.
#     9. tools/test_issue-closing-block.py -- std-lib, offline, 18 cas. Le `gh` de
#        tools/issue-closing-block.py est injecte : les tests le simulent, aucun appel
#        reseau, aucune ecriture GitHub. Aller-retour octet pour octet du texte
#        d'origine (CRLF compris), chaque refus, le chemin --apply.
#
# DEPLOIEMENT -- lire le bloc `on:` ci-dessous, il fait foi
#   - push sur master / pull_request : déclenchés, y compris les changements du
#     registre EAV qui doivent éprouver la garde #2182. build.yml ignore `docs/**`
#     sur push ; ce workflow ne l'ignore donc pas.
#   - workflow_dispatch   : lancement manuel (po-2024 l'utilise apres un touch).
#   - schedule            : hebdomadaire, dimanche ~04:42 UTC (cf. `on.schedule`).
#
#   ⚠️ Ce bloc a deja menti une fois (il annoncait un `paths-ignore` inexistant et
#   un `schedule: aucune` dix lignes au-dessus d'un cron hebdo). Un commentaire qui
#   decrit un mecanisme absent envoie le prochain lecteur chercher une cle qui
#   n'existe pas. En modifiant `on:`, modifier CE bloc dans le meme commit.
#
# MEMO
#   Avant de CABLER un autre test_*.py ici, lire sa docstring : si elle depend d'un
#   bundle, d'un Target/ peuple, ou d'un depot G:, ce n'est PAS ce workflow.

name: Python tools - offline tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Weekly Sunday ~04:42 UTC : la garde est std-lib-only, un cron hebdo suffit.
    # Apres le merge : si la garde passe en CI, son silence verte est credible.
    - cron: '42 4 * * 0'

# Le job ne fait que lire le depot et executer un test std-lib : il n'a besoin
# d'aucun droit d'ecriture. On le borne explicitement plutot que d'heriter du
# defaut du depot, qui peut etre plus large.
permissions:
  contents: read

jobs:
  tree-guard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tree-guard contract test (#1460)
        # 7 cas, std-lib seulement. Aucun artefact, aucun bundle, aucun Target/.
        # C'est le cas NOMINAL de la garde : s'executer la ou il n'y a rien a mesurer.
        # Le cas 7 (grounding sur le depot reel) rend un verdict 0 ou 2 selon
        # la machine ; le test ne l'asserte pas, par design (cf. le fichier).
        run: python tools/test_1460-structure-charpente-pilot.py

  dnn-i18n-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the DNN i18n offline suite (#457)
        # 5 etapes, std-lib, offline : extract -> verify -> reimport (dry-run), puis le
        # self-test du pipeline site-content (2 round-trips + 19 controles, dont les
        # sets prose par content-type). Zero reseau, zero ecriture, zero appel paye ;
        # les fixtures sont committeés, donc la CI est ici un cas NOMINAL.
        # translate_game_rules.py (le traducteur qui appelle l'API) n'est PAS execute.
        run: python tools/dnn_i18n/test_roundtrip.py

  eav-export-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the EAV export guard contract (#458 item 7)
        # 23 cas, std-lib, offline : aucune connexion, aucun web.config. Le module est
        # charge pour ses fonctions de garde ; fetch_rows (la seule a lire la base)
        # n'est jamais appele - finish_rows, son post-traitement, l'est.
        run: python tools/test_458-eav-export-guards.py

  pr-merge-gate-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the merge gate self-test (scripts/gates)
        # Std-lib, offline : instantanes synthetiques et `gh` factice, aucun appel a
        # GitHub (le job n'a ni besoin ni usage d'un jeton). Echoue si une regle ne
        # rend pas le verdict attendu, si elle ne discrimine pas (regle desactivee
        # != PASS), ou si un echec d'API simule rend autre chose que le code 1.
        run: python scripts/gates/pr_merge_gate.py --self-test

  dataset-byte-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the dataset byte contract
        # 26 cas, std-lib, offline. Les 5 CSV de donnees sont dans le checkout : la CI
        # est ici un cas NOMINAL, jamais un vert a vide (un fichier reduit a son en-tete
        # est refuse par le contrat lui-meme). Rouge = une PR a reecrit des fins de
        # ligne, perdu, ajoute ou double un BOM, desaligne un enregistrement, glisse
        # un octet de controle, ou elargi un motif `-text` de .gitattributes.
        run: python tools/test_dataset-byte-contract.py

  agent-docs-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the agent documentation contract (AGENTS.md, CLAUDE.md, docs/agents)
        # 13 cas, std-lib, offline. Un lien relatif mort, un renvoi de section vers un
        # titre renomme, un import en plus de AGENTS.md, ou les deux fichiers charges
        # par defaut au-dessus du budget d'octets : rouge. Le budget se releve dans la
        # PR qui l'argumente, pas pour faire passer un ajout.
        run: python tools/test_agent-docs-contract.py

      - name: Run the doc-move preservation contract
        # 22 cas sur des depots git jetables : l'organe qui prouve qu'un deplacement
        # de documentation n'a perdu aucune ligne doit lui-meme voir chaque perte.
        # N'a pas besoin de l'historique du depot reel.
        run: python tools/test_doc-move-preservation.py

      - name: Run the index-of-record contract (docs/, tools/)
        # 8 cas, std-lib + `git ls-files`. Tout README.md qui porte la marque
        # `<!-- index-of-record -->` doit citer chaque fichier suivi de son dossier,
        # avec un statut : un fichier ajoute sans sa ligne d'index rougit la PR.
        run: python tools/test_docs-index-contract.py

      - name: Run the issue closing-block contract
        # 18 cas, std-lib, `gh` simule : le texte d'origine d'une issue ne change jamais.
        run: python tools/test_issue-closing-block.py
