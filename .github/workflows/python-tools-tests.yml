# Tests Python offline std-lib : garde d'arbre #1460 + suite DNN i18n #457 (charpente #1460).
#
# POURQUOI UN WORKFLOW DISTINCT DE build.yml
#   build.yml est le pipeline dotnet principal : il fait tourner 1129 tests .NET a
#   chaque PR. Il ne lance aucun test Python. La garde d'arbre (#1460) est un test
#   **std-lib seulement, sans arborescence Target/** : elle peut tourner n'importe
#   quand, sans bundle, et elle DOIT tourner pour empecher la regression du contrat
#   que la charpente a pose. La mettre dans build.yml ajouterait du bruit au pipeline
#   principal ; la mettre dans un workflow dedie lui donne un signal clair.
#
# CE QUE CE WORKFLOW FAIT (et ne fait pas)
#   Il execute les test_*.py **dont la condition d'execution est documentee** et qui
#   n'exigent AUCUN artefact. Pourquoi pas tous les test_*.py du depot ? Parce que
#   **certains dependent d'un artefact** (la garde elle-meme en mode pilot doit avoir
#   un Target/ ; d'autres outils lisent la base de regeneration). Ce workflow est la
#   **charpente executable** ; chaque test_*.py sera cable quand sa condition
#   d'execution sera documentee. C'est la distinction posee en tete de
#   docs/quality/1460-charpente-suite-regression.md.
#
#   CABLES A CE JOUR (2), avec la condition qui les autorise ici :
#     1. tools/test_1460-structure-charpente-pilot.py -- std-lib, 7 cas, arbres
#        synthetiques ; aucun Target/ requis (le cas 7 est un grounding sur le depot
#        reel, volontairement NON asserte).
#     2. tools/dnn_i18n/test_roundtrip.py -- std-lib, offline. Condition d'execution
#        documentee dans tools/dnn_i18n/README.md §"Execution condition" : toutes les
#        fixtures sont committeés, aucun bundle, aucun Target/, aucun depot G:, et
#        **aucun appel d'API paye** (translate_game_rules.py, le traducteur, n'est PAS
#        execute par ce test). 5 etapes, dont le self-test du pipeline site-content
#        (2 round-trips + 19 controles).
#
# DEPLOIEMENT -- lire le bloc `on:` ci-dessous, il fait foi
#   - push sur master     : AUCUN declencheur declare. ⚠️ Ce n'est PAS obtenu par
#     un `paths-ignore` : il n'y en a pas, et il n'y a pas non plus de cle `push:`.
#     L'absence de declenchement vient de l'absence du declencheur lui-meme.
#   - pull_request        : AUCUN declencheur declare. build.yml reste seul
#     autorite sur les PRs.
#   - workflow_dispatch   : lancement manuel (po-2024 l'utilise apres un touch).
#   - schedule            : hebdomadaire, dimanche ~04:42 UTC (cf. `on.schedule`).
#
#   ⚠️ Ce bloc a deja menti une fois (il annoncait un `paths-ignore` inexistant et
#   un `schedule: aucune` dix lignes au-dessus d'un cron hebdo). Un commentaire qui
#   decrit un mecanisme absent envoie le prochain lecteur chercher une cle qui
#   n'existe pas. En modifiant `on:`, modifier CE bloc dans le meme commit.
#
# MEMO
#   Avant de CABLER un autre test_*.py ici, lire sa docstring : si elle depend d'un
#   bundle, d'un Target/ peuple, ou d'un depot G:, ce n'est PAS ce workflow.

name: Python tools - offline tests

on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday ~04:42 UTC : la garde est std-lib-only, un cron hebdo suffit.
    # Apres le merge : si la garde passe en CI, son silence verte est credible.
    - cron: '42 4 * * 0'

# Le job ne fait que lire le depot et executer un test std-lib : il n'a besoin
# d'aucun droit d'ecriture. On le borne explicitement plutot que d'heriter du
# defaut du depot, qui peut etre plus large.
permissions:
  contents: read

jobs:
  tree-guard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tree-guard contract test (#1460)
        # 7 cas, std-lib seulement. Aucun artefact, aucun bundle, aucun Target/.
        # C'est le cas NOMINAL de la garde : s'executer la ou il n'y a rien a mesurer.
        # Le cas 7 (grounding sur le depot reel) rend un verdict 0 ou 2 selon
        # la machine ; le test ne l'asserte pas, par design (cf. le fichier).
        run: python tools/test_1460-structure-charpente-pilot.py

  dnn-i18n-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the DNN i18n offline suite (#457)
        # 5 etapes, std-lib, offline : extract -> verify -> reimport (dry-run), puis le
        # self-test du pipeline site-content (2 round-trips + 19 controles, dont les
        # sets prose par content-type). Zero reseau, zero ecriture, zero appel paye ;
        # les fixtures sont committeés, donc la CI est ici un cas NOMINAL.
        # translate_game_rules.py (le traducteur qui appelle l'API) n'est PAS execute.
        run: python tools/dnn_i18n/test_roundtrip.py
