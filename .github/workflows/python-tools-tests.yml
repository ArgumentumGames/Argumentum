# Tests Python offline std-lib : garde d'arbre #1460 + suite DNN i18n #457 + gardes export EAV #458 (charpente #1460)
# + auto-test du gate de merge (scripts/gates) + contrat d'octets des CSV de donnees + contrats de la documentation pour agents + contrat des index de reference + outil du bloc de cloture des issues + garde des liens transverses des mindmaps #2190.
# + contrat Node du bundle BS5 Accordion4 #2317 (job separe, aucun npm install).
# + temoins des sondes de polices #1485 (cle de cache, glyphe nul, famille vide).
#
# POURQUOI UN WORKFLOW DISTINCT DE build.yml
#   build.yml est le pipeline dotnet principal : il fait tourner 1129 tests .NET a
#   chaque PR. Il ne lance aucun test Python. La garde d'arbre (#1460) est un test
#   **std-lib seulement, sans arborescence Target/** : elle peut tourner n'importe
#   quand, sans bundle, et elle DOIT tourner pour empecher la regression du contrat
#   que la charpente a pose. La mettre dans build.yml ajouterait du bruit au pipeline
#   principal ; la mettre dans un workflow dedie lui donne un signal clair.
#
# CE QUE CE WORKFLOW FAIT (et ne fait pas)
#   Il execute les test_*.py **dont la condition d'execution est documentee** et qui
#   n'exigent AUCUN artefact. Pourquoi pas tous les test_*.py du depot ? Parce que
#   **certains dependent d'un artefact** (la garde elle-meme en mode pilot doit avoir
#   un Target/ ; d'autres outils lisent la base de regeneration). Ce workflow est la
#   **charpente executable** ; chaque test_*.py sera cable quand sa condition
#   d'execution sera documentee. C'est la distinction posee en tete de
#   docs/quality/1460-charpente-suite-regression.md.
#
#   CABLES A CE JOUR (19), avec la condition qui les autorise ici :
#     1. tools/test_1460-structure-charpente-pilot.py -- std-lib, 7 cas, arbres
#        synthetiques ; aucun Target/ requis (le cas 7 est un grounding sur le depot
#        reel, volontairement NON asserte).
#     2. tools/dnn_i18n/test_roundtrip.py -- std-lib, offline. Condition d'execution
#        documentee dans tools/dnn_i18n/README.md §"Execution condition" : toutes les
#        fixtures sont committeés, aucun bundle, aucun Target/, aucun depot G:, et
#        **aucun appel d'API paye** (translate_game_rules.py, le traducteur, n'est PAS
#        execute par ce test). 5 etapes, dont le self-test du pipeline site-content
#        (2 round-trips + 19 controles).
#     3. tools/test_458-eav-export-guards.py -- std-lib, offline, 23 cas. Charge
#        tools/458-eav-content-export.py SANS se connecter a la base (aucun
#        web.config lu) et eprouve ses gardes sur des rangees synthetiques : RawData
#        (soumissions visiteurs, app 50) refuse a la config, dans le SQL et par
#        rangee ; champs app 50 re-derives des vues committees du formulaire ;
#        app 48 bornee a l'entite mesuree E10181 ; temoins ; actualites app 52
#        completes dans les 8 langues (#2182), avec 24 mutations inverses en sous-tests.
#     4. scripts/gates/pr_merge_gate.py --self-test -- std-lib, offline. Le gate de
#        merge lit GitHub via `gh api` en usage reel ; son auto-test NE LE FAIT PAS :
#        instantanes synthetiques + un `gh` factice. Pour chaque regle, le defaut
#        injecte doit rendre le verdict attendu, puis la regle desactivee doit
#        rendre PASS (mutation falsifiante) ; chaque point d'API en echec doit
#        rendre le code 1, jamais 0. Aucun jeton, aucun appel reseau, aucun artefact.
#     5. tools/test_dataset-byte-contract.py -- std-lib, offline, 26 cas. Lit les 5 CSV
#        de donnees vivants DU CHECKOUT (toujours presents : aucun artefact, aucun
#        Target/) et epingle leur forme d'octets : un seul BOM, CRLF en fin
#        d'enregistrement, LF nus en cellule, nombre de champs (les enregistrements
#        courts de Rules sont NOMMES par leur cle), aucun octet de controle. 20
#        mutations des octets reels + 1 temoin prouvent que chaque regle voit son
#        defaut. Deux cas lisent `git check-attr` (regle `-text` de .gitattributes,
#        dans les deux sens, a la casse exacte) : ils ECHOUENT au lieu de se sauter
#        si git manque en CI.
#     6. tools/test_agent-docs-contract.py -- std-lib, offline, 13 cas. Les cas 1-4
#        lisent AGENTS.md, CLAUDE.md et docs/agents/ **du depot reel** : liens
#        relatifs, renvois de section, import unique, budget d'octets des deux
#        fichiers charges par defaut. Les cas 5-13 eprouvent les detecteurs sur un
#        arbre synthetique (un lien mort, un titre renomme, un import ajoute SONT
#        vus). Aucun artefact : les documents controles sont le depot lui-meme.
#     7. tools/test_doc-move-preservation.py -- std-lib + `git` (present sur le
#        runner), offline, 22 cas sur des depots `git init` jetables en repertoire
#        temporaire. N'interroge PAS l'historique du depot reel : le `fetch-depth`
#        par defaut suffit. Eprouve tools/doc-move-preservation.py (preuve ligne a
#        ligne d'un deplacement de documentation) : chaque facon de perdre une ligne
#        est vue, et un organe qui ne peut pas mesurer rend 2, jamais un vert.
#     8. tools/test_docs-index-contract.py -- std-lib + `git ls-files`, offline,
#        10 cas. Le cas 1 lit les index du depot reel (tout README.md sous docs/ ou
#        tools/ qui porte la marque `<!-- index-of-record -->`) : chaque fichier
#        suivi du dossier y est cite avec un statut, aucun lien mort. Le cas 2
#        exige que les dossiers consolides (REQUIRED_INDEXES) gardent leur
#        marque ; la PR qui pose une marque y ajoute son dossier. Les cas 6-13
#        eprouvent les detecteurs sur des depots `git init`
#        jetables. Methode :
#        docs/agents/consolidation.md.
#     9. tools/test_issue-closing-block.py -- std-lib, offline, 18 cas. Le `gh` de
#        tools/issue-closing-block.py est injecte : les tests le simulent, aucun appel
#        reseau, aucune ecriture GitHub. Aller-retour octet pour octet du texte
#        d'origine (CRLF compris), chaque refus, le chemin --apply.
#    10. tools/test_fallacies_i18n_hierarchy_apply.py -- std-lib, offline, 11 cas.
#        Charge tools/fallacies_i18n_hierarchy_apply.py et eprouve son contrat sur des
#        rangees synthetiques (carte canonique, trous, conflits, cles nouvelles,
#        aller-retour d'application BOM+CRLF). Le cas de grounding lit le CSV Fallacies
#        VIVANT du checkout (toujours present : aucun artefact) et accepte deux etats
#        coherents : 144 cellules (inventaire pre-apply #712/#716) ou 0 (trou comble --
#        etat de master, P24-24). Tout autre compte = application partielle ou nouveau
#        trou : rouge. Condition d'execution documentee dans la docstring du fichier.
#    11. tools/test_2190-crosslink-integrity.py -- std-lib, offline, 8 cas, ~7 s.
#        Charge tools/2190-crosslink-integrity.py (garde des annotations des liens
#        transverses des mindmaps Fallacies) et l'eprouve dans les DEUX sens :
#        depots synthetiques minimaux d'une rangee et deux noeuds (chaque compte
#        non-nul PAR CONSTRUCTION — un vert a compte nul ne serait pas une mesure),
#        chaque defaut injecte rougit sa couche (C1/C3/C4) ; puis la garde reelle
#        sur les 8 langues du checkout (cas NOMINAL : les cartes sont commitees,
#        aucun artefact, aucun Target/) et les cinq temoins de mutation du module
#        (m1-m5) — dont m2, la permutation entre deux traits de meme verbe, qui
#        doit laisser C1 VERT : c'est le trou que la couche geometrique C4 ferme.
#        Condition d'execution documentee dans la docstring du fichier.
#    12. tools/test_2190-served-mindmap-inventory.py -- std-lib + git, OFFLINE : le
#        serveur HTTP est local et jetable, aucune préprod ni réseau externe. Témoin
#        identique au blob, mutation d'octets et route absente doivent être distingués.
#    13. tools/test_458-eav-reinject-guards.py -- std-lib, offline, 93 cas. Charge
#        tools/458-eav-reinject.py SANS se connecter (EXP.run_query remplace par un
#        faux qui sert des rangees synthetiques) et eprouve les gardes de refus
#        G1-G3 de la re-injection EAV (#2326, revue c.7053569313) : chaque garde
#        avec son temoin sain ET sa mutation (garde neutralisee dans le source ->
#        le meme defaut passe sans refus — le test epingle la garde, pas un effet
#        de bord). Eprouve aussi les trois retouches P23-27 (contre-revue po-2024
#        c.7057778259) : carte d'apps imprimee avant fetch_target, EntityId listes
#        par le refus G1 (et refus maintenu si la liste echoue), garde de source
#        contre la formulation « rangee servie = ValueId MAX » refutee par M1/M3.
#        Depuis P23-38, les deux reserves de la contre-revue #2362
#        (c.7131327983) : le fragment FROM..WHERE de g1_entity_ids est le meme que
#        celui du comptage, compare sur les SQL captures a l'execution avec une
#        mutation par cote (R4) — l'ancre est FROM depuis la contre-revue po-2024
#        de #2362 : un JOIN ajoute a la seule liste a sa mutation, et un controle
#        inverse laisse verte une divergence hors FROM..WHERE ; et l'avertissement
#        « la base a bouge entre les deux lectures » a son cas court, son cas long,
#        son temoin muet et sa mutation (R5).
#        Depuis l'ecrasement nomme (--force, #2181) : seule la cellule NOMMEE sort
#        du CONFLIT, un nom qui ne designe rien est refuse avant toute lecture, et
#        la branche FORCE du script writer est LUE (comparaison ordinale, rangee
#        epinglee par ValueId, sous verrou) avec sa mutation. Le script writer
#        n'est jamais execute ici : seule la lane qui sert la base l'execute.
#        Depuis #2181 (W2-09/W2-14), le mode borne `--only-cell GUID:CHAMP:LANGUE` :
#        il resserre l'ECRITURE sur les cellules nommees et laisse la carte d'apps,
#        la lecture de la cible (G1) et la preservation sur le registre COMPLET (une
#        carte mesuree sur un registre tranche perdrait sa marge, G2). Cas : le
#        conflit d'une autre entite ne bloque plus un lot sain, la cible reste lue
#        en entier, un nom inconnu ou mal forme est refuse avant toute connexion,
#        une cellule nommee qu'un reglage ecarte est refusee (SKIP du bloc sans son
#        drapeau, reference file:NNN), et la politique de base fr (bloc #2181) est
#        MONTREE a blanc puis REFUSEE a l'apply. Un cas rejoue la passe « 11
#        cellules (dont le francais) » de W2-09 sur une cible synthetique.
#        Les deux validateurs de nom (--force, --only-cell) sont le MEME
#        (FORCE_GUID_RE) : un seul analyseur pour une seule forme de cle.
#        Depuis P24-54 (#2181), le levier NOMME de la base fr du bloc,
#        `--fr-force GUID:CHAMP` : il n'accepte qu'un seul nom (la base fr du bloc
#        « L'argumentation », champ Text, GUID complet) ; sans lui la base reste
#        FR_EXCLUDED comme sur master, et le rapport ne porte aucune section du
#        levier. La branche FR_FORCE du script writer est LUE (comparaison
#        ordinale de la valeur d'avant, rangee epinglee par ValueId, sous verrou),
#        et les lignes de DECISION de la garde « #2181 identique » sont JOUEES
#        sous chaque PowerShell disponible (`powershell` 5.1, `pwsh` 7) sur un
#        payload factice, contre six mutants. Sans shell, ce cas est saute sur un
#        poste et ROUGE en CI : un contrat aveugle ne doit pas etre vert.
#        Deux instruments de ce grain se lancent A LA MAIN, hors CI (ils rejouent
#        des suites entieres) : tools/2181-reinject-mutations.py (59 mutations de
#        l'outil — N1-N13 l'ecrasement nomme, N14-N34 le mode borne, N35-N59 le
#        levier de la base fr — temoin 93/93)
#        et tools/2181-reinject-rehearsal.py (repetition du
#        plan entre deux registres, aucune base).
#        Le faux run_query refuse tout SQL non attendu : une derive des
#        requetes fait echouer le test bruyamment, jamais passer des rangees
#        fausses. Condition d'execution documentee dans la docstring du fichier.
#    14. tools/test_458-derive-run-registry.py -- std-lib, offline, 5 cas, ~0.4 s.
#        Execute tools/458-derive-run-registry.py (copie d'execution du registre,
#        arbitrage ai-01 22/11 option iii) sur le registre officiel COMMITTE :
#        empreinte de sortie epinglee, 22 retirees / 651 conservees, la carte
#        existante garde ses champs hors Link, aucun -review survivant, et controle
#        inverse (entree mutee d'un octet refusee). Aucune connexion, aucune base :
#        la CI est le cas NOMINAL du rejouage du geste. Condition d'execution
#        documentee dans la docstring du fichier.
#    15. tools/test_458-cascade-drift-roundtrip.py -- std-lib + `git` (present sur le
#        runner), offline, 3 cas, ~25 s. Construit un depot `git init` jetable de trois
#        commits et eprouve tools/458-cascade-drift-scan.py sur la forme mesuree au
#        rapport P24-07 §3 (PK 1282) : FR court -> long -> court avec traduction jamais
#        retouchee = ALLER-RETOUR, ecarte par defaut ; FR long -> court jamais revenu
#        = derive GARDEE (controle inverse dans la meme passe, un instrument qui
#        ecarterait tout ne passerait pas) ; traduction qui a suivi le FR = jamais
#        candidate. `--keep-round-trips` restaure le comportement d'avant le 23/11.
#        Ne lit aucun corpus reel : le depot jetable est la seule entree. Le balayage
#        du vrai corpus Fallacies demande l'historique complet (164 commits) alors que
#        `actions/checkout` clone en `fetch-depth: 1` — mesure sur un corpus tronque,
#        il ne verrait aucun candidat et un vert a compte nul ne serait pas une mesure.
#        Condition d'execution documentee dans la docstring du fichier.
#    16. tools/test_1105-home-render-p2.py -- std-lib, offline, 34 cas, ~0.1 s. Charge
#        tools/1105-cutover-day-controls.py et eprouve sa sonde P2 (section 6 du
#        rapport : dir="rtl" en ar et fa seulement, meta description non vide,
#        selecteur de langue a 7 liens, marqueur d'audience) sur du HTML
#        SYNTHETIQUE, dans la forme mesuree sur le servi le 24/11. Le cas bout-en-bout
#        execute main() avec un `fetch` FAUX : aucun curl, aucun reseau, le site servi
#        n'est jamais demande. Il epingle aussi la discipline du runbook : un ecart de
#        cette sonde laisse le code de sortie a 0, une route rouge sort 1. Depuis
#        P24-50, il eprouve le REVEIL du site endormi : transport a demarrage a froid
#        et horloge SIMULES (un serveur qui ne repond qu'apres la borne de passe passe
#        grace a l'eveil ; le meme sans eveil rougit a l'ancienne borne), un serveur
#        muet sort 1 sans faire tourner la passe, un 503 a l'eveil n'est pas un site
#        muet, et les bornes 60 / 240 sont epinglees en litteraux.
#        Condition d'execution documentee dans la docstring du fichier.
#    17. tools/test_2398-page-witness.py -- std-lib, offline, 19 cas, ~0.1 s. Charge
#        docs/dnn-localization/dnn-page-witness.py (le temoin HTTP des trois defauts
#        servis en prod : marqueur 2sxc, bouton FR, ancien texte FR) et execute son
#        run() EN ENTIER avec un `fetch` FAUX : aucun reseau, les deux environnements
#        servis ne sont jamais demandes. Un site synthetique sain rend 70 constats OK ;
#        chaque defaut injecte rougit SON constat et lui seul, et aucune ligne ne
#        saute. Les trois faux verts de la contre-revue c.7202541558 (reponses toutes
#        en fr-FR, Argumentation sans corps, lien /legal/details avant l'article) y
#        sont des cas ; contre l'ancien blob d956ab0d, le meme fichier rougit 15 cas
#        sur 19. Condition d'execution documentee dans la docstring du fichier.
#    18. tools/fonts/test_font-coverage.py -- std-lib + `git`, OFFLINE, 8 cas,
#        ~1,5 s. `urlopen` est remplace par un faux qui REFUSE toute URL non
#        attendue, les polices sont synthetiques (sfnt nu de trois tables) ; le
#        corpus est lu dans le checkout (`--ref HEAD`). Eprouve
#        tools/fonts/font-coverage.py (#1485) apres la contre-revue c.7191872553 :
#        la cle du cache est l'URL (deux URL sous une meme etiquette = deux
#        telechargements ; une meme URL reutilisee = un), le premier point d'un
#        groupe format 12 de glyph id 0 n'est pas couvert (singleton compris), et
#        une famille qui se deplie en rien donne une ligne ERREUR -- chacun avec
#        son controle sain. Les memes assertions sur le fichier d'avant
#        (4af6ccae) donnent 5 rouges sur 8. Condition d'execution documentee
#        dans la docstring du fichier.
#    19. tools/test_133-owl-snapshot-pin.py -- std-lib + `git`, OFFLINE, 4 cas,
#        ~1,6 s. Epingle l'instantane docs/ontology/v1.0.0/ (P24-57) : les deux oids
#        des blobs committes (`git rev-parse HEAD:<chemin>`, pas un hachage du
#        fichier de travail), l'ensemble exact des deux fichiers, et l'ontologyIRI
#        que l'instantane partage avec son canonique (la phrase du §6 du README).
#        Controles inverses : un octet retourne dans les octets du blob rend un oid
#        DIFFERENT, et les octets intacts rendent l'oid epingle. `git` et `HEAD`
#        doivent etre lisibles ; sinon les cas echouent, jamais un saut (un contrat
#        aveugle ne doit pas etre vert). Condition d'execution documentee dans la
#        docstring du fichier.
#
# DEPLOIEMENT -- lire le bloc `on:` ci-dessous, il fait foi
#   - push sur master / pull_request : déclenchés, y compris les changements du
#     registre EAV qui doivent éprouver la garde #2182. build.yml ignore `docs/**`
#     sur push ; ce workflow ne l'ignore donc pas.
#   - workflow_dispatch   : lancement manuel (po-2024 l'utilise apres un touch).
#   - schedule            : hebdomadaire, dimanche ~04:42 UTC (cf. `on.schedule`).
#
#   ⚠️ Ce bloc a deja menti une fois (il annoncait un `paths-ignore` inexistant et
#   un `schedule: aucune` dix lignes au-dessus d'un cron hebdo). Un commentaire qui
#   decrit un mecanisme absent envoie le prochain lecteur chercher une cle qui
#   n'existe pas. En modifiant `on:`, modifier CE bloc dans le meme commit.
#
# MEMO
#   Avant de CABLER un autre test_*.py ici, lire sa docstring : si elle depend d'un
#   bundle, d'un Target/ peuple, ou d'un depot G:, ce n'est PAS ce workflow.

name: Python tools - offline tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Weekly Sunday ~04:42 UTC : la garde est std-lib-only, un cron hebdo suffit.
    # Apres le merge : si la garde passe en CI, son silence verte est credible.
    - cron: '42 4 * * 0'

# Le job ne fait que lire le depot et executer un test std-lib : il n'a besoin
# d'aucun droit d'ecriture. On le borne explicitement plutot que d'heriter du
# defaut du depot, qui peut etre plus large.
permissions:
  contents: read

jobs:
  tree-guard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tree-guard contract test (#1460)
        # 7 cas, std-lib seulement. Aucun artefact, aucun bundle, aucun Target/.
        # C'est le cas NOMINAL de la garde : s'executer la ou il n'y a rien a mesurer.
        # Le cas 7 (grounding sur le depot reel) rend un verdict 0 ou 2 selon
        # la machine ; le test ne l'asserte pas, par design (cf. le fichier).
        run: python tools/test_1460-structure-charpente-pilot.py

  dnn-i18n-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the DNN i18n offline suite (#457)
        # 5 etapes, std-lib, offline : extract -> verify -> reimport (dry-run), puis le
        # self-test du pipeline site-content (2 round-trips + 19 controles, dont les
        # sets prose par content-type). Zero reseau, zero ecriture, zero appel paye ;
        # les fixtures sont committeés, donc la CI est ici un cas NOMINAL.
        # translate_game_rules.py (le traducteur qui appelle l'API) n'est PAS execute.
        run: python tools/dnn_i18n/test_roundtrip.py

  eav-export-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the EAV export guard contract (#458 item 7)
        # 23 cas, std-lib, offline : aucune connexion, aucun web.config. Le module est
        # charge pour ses fonctions de garde ; fetch_rows (la seule a lire la base)
        # n'est jamais appele - finish_rows, son post-traitement, l'est.
        run: python tools/test_458-eav-export-guards.py

  eav-reinject-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure a PowerShell shell is present (the #2181 guard is played under it)
        # Le cas « la garde « #2181 identique » est jouee sous powershell » ne peut pas
        # se sauter en CI : un contrat aveugle ne doit pas etre vert. L'image
        # ubuntu-latest en porte un ; si elle change, cette etape l'installe plutot
        # que de laisser le contrat se taire en silence.
        run: |
          if ! command -v pwsh >/dev/null 2>&1 && ! command -v powershell >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          command -v pwsh || command -v powershell

      - name: Run the EAV reinject guard contract (#458 P23-24 G1-G3, P23-27 R1-R3, P23-38 R4-R5, #2181 --force, --only-cell, --fr-force)
        # 93 cas, std-lib, offline : aucune connexion, aucun web.config. Les gardes
        # de refus G1-G3 (paire (app, guid) multi-entites, vainqueur de carte sans
        # marge, carte non injective) sont eprouvees chacune par un temoin sain et
        # une MUTATION : la garde neutralisee dans le source doit laisser passer
        # le defaut — le test epingle la garde, pas un effet de bord. Les retouches
        # P23-27 (carte imprimee avant fetch_target, EntityId listes dans le refus
        # G1, source sans la formulation refutee par M1/M3) ont leur propre cas et
        # leur propre mutation. Les reserves #2362 (c.7131327983) ajoutent le
        # fragment FROM..WHERE compare sur les SQL captures (R4, ancre FROM depuis
        # la contre-revue po-2024 : mutation JOIN vue, divergence hors fragment
        # verte) et l'avertissement « la base a bouge entre les deux lectures » (R5).
        # Depuis #2181 : --force, --only-cell, puis --fr-force (P24-54), le levier
        # nomme de la base fr du bloc — la garde « #2181 identique » du script
        # writer est jouee sous les PowerShell disponibles du runner.
        run: python tools/test_458-eav-reinject-guards.py

  eav-derive-run-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the derive-run-registry contract (#458 P23-30, arbitrage option iii)
        # 5 cas, std-lib, offline, ~0.4 s : execute tools/458-derive-run-registry.py
        # sur le registre officiel COMMITTE (toujours present : aucun artefact) et
        # epingle la copie d'execution de l'arbitrage ai-01 du 22/11 : empreinte de
        # sortie ef3eaa6a... (1 187 696 octets ; a130a663... / 1 166 868 avant
        # l'append P23-36 du 25/11, 92bf1e06... / 1 166 864 avant la correction
        # typographique P24-32), 673 -> 22 retirees -> 651 conservees,
        # la carte 6A24AE92 garde ses autres champs, aucun marqueur -review survivant,
        # et controle inverse : un registre mute d'un octet est refuse (exit non nul,
        # aucune sortie ecrite). Toute derive LEGITIME du registre officiel rougit
        # ici AVANT d'atteindre le staging — c'est le role de l'epinglage.
        run: python tools/test_458-derive-run-registry.py

      - name: Run the cascade-drift round-trip contract (#458 P24-42)
        # 3 cas, std-lib + git, offline, ~25 s : construit un depot git jetable (trois
        # commits) et eprouve tools/458-cascade-drift-scan.py sur la forme mesuree au
        # rapport P24-07 §3 (PK 1282) : FR court -> long -> court, traduction jamais
        # retouchee = ALLER-RETOUR, ecarte par defaut ; FR long -> court jamais revenu
        # = derive GARDEE (controle inverse dans la meme passe) ; traduction qui a suivi
        # le FR = jamais candidate. --keep-round-trips restaure le comportement d'avant
        # le 23/11. Aucun corpus reel lu : sur un clone `fetch-depth: 1`, un balayage
        # tronque rendrait un vert a compte nul, qui n'est pas une mesure.
        run: python tools/test_458-cascade-drift-roundtrip.py

