# Dependabot configuration for ArgumentumGames/Argumentum
#
# Authored by po-2024 (tick 113), dispatched by ai-01 (`3zhzkb`).
# Merged in #910. Scope arbitrated by jsboige 2026-07-26 (interactive): option A —
# "surveiller, groupé + ignore-major" on the 26 vendored 2sxc/DNN npm trees. They stay
# under dependabot surveillance (security patches/minors keep arriving); only majors are
# filtered. Ceiling ~26 PR/week instead of several hundred ungrouped.
#
# Policy summary:
#   1. nuget (our .NET pipeline)         -> group + ignore the load-bearing pins (see `ignore` below)
#   2. npm vendored DNNPlatform trees     -> group + ignore majors (unvalidated in CI, #901)
#   3. npm our trees (CardPen, pdf-val)   -> group + ignore majors
#
# Why groups: collapses multiple same-directory bumps into ONE pull request. The repo saw
# ~34 dependabot PRs in a single cycle (mostly the same package bumped across many 2sxc
# module trees, e.g. loader-utils x5). `groups` turns N-per-dir into 1-per-dir.
#
# Why ignore-major on npm vendored: a major bump edits package.json in a tree that nothing
# in CI builds or consumes (#901 - webpack-dev-server 5->6 in Bootstrap 4 Instant; that PR was
# closed out-of-policy under this very rule). Patch/minor are lockfile-only and are merged
# per precedent #120.
#
# Escape hatch: if a CVE is ever fixable ONLY by a major on a vendored tree, drop the `ignore`
# for that one directory here — do not merge the major bypassing this policy.
#
# Why the nuget `ignore` list is NOT "all majors": grouping is all-or-nothing, so one unmergeable
# package holds the whole group hostage (#941 bundled 24 updates around 3 bad ones). The list names
# only packages whose pin is an ALREADY-RECORDED decision — licence (#588, #905) or a documented
# runtime coupling (CLAUDE.md "Stable Dependency Versions"). Everything else keeps flowing and gets
# triaged on its merits. To add an entry, cite the decision; do not add one to silence a red build.
#
# The `labels:` below reference nuget / npm / vendored, which did NOT exist in the repo until
# 2026-07-27 — dependabot posted a "labels could not be found" comment on every PR it opened
# (#941, #945 and the 26 npm ones). The labels now exist; do not delete them without also
# editing this file, or the noise comes back on every future PR.

version: 2
enable-beta-ecosystems: false

updates:
  # --- 1. NuGet: the .NET pipeline (our code) ---
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns: ["*"]
    ignore:
      # AutoMapper 14.0.0 is the LAST MIT release; 15.0.0+ flips to RPL-1.5 / commercial
      # (Lucky Penny, requireLicenseAcceptance). Pinned by decision jsboige 2026-06-23 (#588).
      # A dependabot major bump would re-propose the commercial line; ignore it at the source.
      - dependency-name: "AutoMapper"
        update-types: ["version-update:semver-major"]
      # FluentAssertions 7.2.2 is the LAST Apache-2.0 release; 8.0+ flips to a commercial
      # Xceed licence (the exact invisible-to-expression-scanner shape #905 flagged, same as
      # QuestPDF below). #949 proposed 8.10.0 and would have shipped the commercial line inside
      # a grouped bump. Pinned by ai-01's #949 disposition (licence-purity, same basis as the
      # AutoMapper pin #588 and the PdfPig swap #908). semver-major only: 7.2.x Apache patches
      # keep flowing; only the 7->8 commercial jump is blocked. The 8.5.0 -> 7.2.2 downgrade
      # ships in the same PR as this entry (ai-01: "la séquence importe" -- pinning before
      # downgrading would freeze the commercial version).
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      # SixLabors.ImageSharp 3.1.x is the last line that BUILDS without a purchased licence key.
      # MEASURED on #1097 (run 32002605172, `build (Release)`, 2026-08-17) -- 4.1.0 fails the build
      # outright, it does not merely change a licence field:
      #   SixLabors.ImageSharp.targets(28,5): error : No Six Labors license found. Set
      #   $(SixLaborsLicenseKey), set $(SixLaborsLicenseFile), or add a 'sixlabors.lic' file
      #   SixLabors.ImageSharp.targets(28,5): error : Please obtain a license from
      #   https://sixlabors.com/pricing/
      # Third instance of the AutoMapper (#588) / FluentAssertions (#949) class: a dependency that
      # flips to commercial at a major. This one is the LOUDEST of the three -- it breaks CI instead
      # of silently shipping a commercial line -- which is why it is the only one we found by reading
      # a red build rather than a nuspec. Do not read that as "just fix the build": the red IS the
      # licence, and the fix on offer is a purchase.
      # semver-major only: 3.1.x patches keep flowing. Consumers are test/tooling-only
      # (VisualTests.csproj, Tools/PdfPreviewExtractor) and ship in no binary, but that is
      # irrelevant here -- the gate is at BUILD time, so a test-only reference is enough to red
      # the pipeline. Note SixLabors.ImageSharp.Drawing 2.1.7 rides the same licence regime; it has
      # no major proposed yet, so it gets no entry until one is (do not add speculative pins).
      #
      # Why this entry exists at all, given #1097 was already red: grouping is all-or-nothing (see
      # the header note on #941). #1097 bundled FIVE bumps -- Microsoft.NET.Test.Sdk 18.9.0,
      # xunit.runner.visualstudio 4.0.0, OpenAI 2.13.0, System.Management 10.0.11 -- and ImageSharp
      # held the other four hostage for five days. Ignoring ImageSharp at the source lets dependabot
      # regenerate the group WITHOUT it, so those four can be judged on their merits.
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]
      # QuestPDF 2022.12.12 is the last release carrying the SPDX expression `MIT`.
      # MEASURED on the NuGet catalog (2026-07-26): 2022.12.12 -> licenseExpression "MIT";
      # 2026.7.1 -> NO licenseExpression at all, licenseUrl = aka.ms/deprecateLicenseUrl,
      # i.e. the embedded `<license type="file">` form. That is the exact mechanism #905
      # flagged as invisible to expression-only scanners (same shape as FluentAssertions 8.x).
      # The #905 release gate reads "24/24 permissive" off those expressions, so a QuestPDF
      # bump silently removes the evidence the gate is built on. ALL update types ignored,
      # not just majors: the pin is a licence pin, and QuestPDF uses calendar versioning.
      # (CLAUDE.md also pins it for the thread-safety behaviour the global PDF lock assumes.)
      - dependency-name: "QuestPDF"
      # SkiaSharp is QuestPDF's native rendering backend and is pinned in CLAUDE.md as
      # "Required for QuestPDF". With QuestPDF frozen at 2022.12.12, a major Skia bump
      # (2.88.6 -> 4.150.1 was proposed in #941) moves one half of a matched pair.
      # Minor/patch stay allowed -- DELIBERATELY. #945 delivered 2.88.6 -> 2.88.9, a patch
      # inside the 2.88.x line QuestPDF 2022.12.12 links against; that is the pin working as
      # intended, not a leak. Do not widen this entry to all update types by analogy with
      # Playwright below: the two cases differ in the package's versioning, not in our intent.
      - dependency-name: "SkiaSharp.NativeAssets.Win32"
        update-types: ["version-update:semver-major"]
      # Playwright 1.43.0 is pinned in CLAUDE.md. Since #911 the CI Test step actually
      # launches real Chromium (HtmlToPngConverterTests, PdfAssemblerTests self-install the
      # browser); 1.43.0 also carries the mirror-fallback chain that survives the
      # playwright.azureedge.net 400s observed in CI. A major bump is a deliberate,
      # tested operation, not a grouped drive-by.
      #
      # ALL update types, and the reason is MEASURED, not stylistic: this entry used to read
      # `update-types: ["version-update:semver-major"]`, which is a NO-OP for this package.
      # Microsoft.Playwright has never left the 1.x line (1.0 -> 1.61 as of 2026-07), so a
      # semver-major update cannot fire, ever. #945 duly proposed 1.43.0 -> 1.61.0 as a MINOR
      # and the filter let it through -- the pin was decorative. Found by po-2024's review on
      # #945 and confirmed firsthand against the PR's package delta.
      # Lesson worth keeping: an ignore entry is only as strong as the package's versioning
      # scheme. "Ignore majors" protects nothing on a project that never bumps its major.
      - dependency-name: "Microsoft.Playwright"
      # Humanizer 2.14.1 -> 3.0.10 changes the OWL IRI fragments we PUBLISH. MEASURED on #949
      # (run 89854763158, `build (Release)`): 643 tests, 636 passed, 2 failed, both of them the
      # GetId contract tests, and nothing else --
      #   VirtueOwlGenerationContractTests.GetId_StripsApostrophesHyphensCommas        [40 ms]
      #   OwlGetIdPureContractTests.FrenchFallacyName_ProducesFragment_AccentsPreserved [1 ms]
      # Both assert GetId("Appel à l'autorité") == "appelÀLautorité"; both pass on master
      # (verified locally 2026-07-27, 10/10 on the filtered run). `GetId` is `Camelize` plus a
      # Replace chain, i.e. Humanizer IS the transform -- and v3 is a declared breaking major
      # (its own release notes ship a Roslyn analyzer for the "v3 namespace migration").
      #
      # Why this is more than a red test: those fragments are the IDENTITY of the published
      # ontology -- 1 408 fallacy IRIs in docs/ontology/argumentum.owl and 223 virtue IRIs in
      # argumentum_virtues.owl are built by this function. A silent Camelize change renames
      # every accented term's IRI on the next regeneration, breaking external consumers
      # (#133 publication, the CoursIA import) with a green build and no diff in our own code.
      # Same shape as the licence findings above, one axis over: a package can change
      # identity-bearing OUTPUT without any tool announcing it.
      #
      # Majors only -- and here that filter is NOT the no-op it was for Playwright: Humanizer's
      # break IS at the major boundary (2.x -> 3.x). The general rule the two cases share is
      # that the right filter depends on where the package puts its break, so measure the
      # package's versioning before choosing the update-types.
      # Deferred work this pin accompanies: issue #951 (deliberate v3 migration + an explicit
      # decision on whether published IRIs may change, which is jsboige's, not ours).
      - dependency-name: "Humanizer"
        update-types: ["version-update:semver-major"]
      # NOT pinned, on purpose: dotNetRdf. The #945 review first attributed the OwlAdapter
      # break to dotNetRdf 3.3.2 -> 3.5.2; re-measured, that is wrong. dotNetRdf supplies
      # VDS.RDF (parsing, used elsewhere in the same file), its bump is a MINOR, and
      # RDFSharp.RDFResource is the type our code PASSES, not the one that moved. Pinning it
      # would have been an over-pin bought on a mis-attribution.
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "nuget"

